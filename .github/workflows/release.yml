name: Create GitHub Release

# 自动发布仅由 docker-publish 在 quality 和镜像推送成功后调用。
# 恢复同样通过 docker-publish 的已验证产物入口，不独立 dispatch 或响应 tag push。
#
# 设计：
# - Release body 优先使用 tag 自带的 annotation；若 tag 是 lightweight 则用
#   该 tag 指向 commit 的 message。
# - 同时附加 GitHub 内置的"Generate release notes"（自动归类 PR / commits）。
# - prerelease 自动识别：tag 含 -rc / -alpha / -beta / -pre 时标 prerelease=true。
# - 幂等：若同名公开 Release 已存在则跳过；同名草稿明确报错，不擅自公开。

on:
  workflow_call:
    inputs:
      tag:
        description: "已完成镜像发布的 tag"
        required: true
        type: string

permissions:
  contents: write   # 创建 Release 需要

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag name
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$TAG" ]]; then
            echo "❌ 解析 tag 失败" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # prerelease 判定
          if [[ "$TAG" =~ -(rc|alpha|beta|pre|dev) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0      # 需要历史 commit 用来生成 body

      - name: Build release body
        id: body
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]]; then
            # 固定发布入口的 annotation 就是已批准正文，不删改版本号开头的首行。
            MSG="$(git tag -l --format='%(contents)' "$TAG" || true)"
          else
            # 仅保留旧 lightweight tag 的 commit-message 去标题行为。
            MSG="$(git log -1 --pretty=%B "$TAG")"
            FIRST_LINE="$(echo "$MSG" | head -n1)"
            if [[ "$FIRST_LINE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              MSG="$(echo "$MSG" | tail -n +2)"
              MSG="$(echo "$MSG" | sed -e '/./,$!d')"
            fi
          fi
          # 通过 multiline output 安全传递
          {
            echo "body<<__END_OF_BODY__"
            echo "$MSG"
            echo "__END_OF_BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if IS_DRAFT="$(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft')"; then
            if [[ "$IS_DRAFT" != false ]]; then
              echo "Release $TAG 是草稿或状态未知；请先处理，不能当作已公开版本，也不会自动公开。" >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Release $TAG 已公开，跳过创建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        if: steps.exist.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          BODY: ${{ steps.body.outputs.body }}
          PRE: ${{ steps.tag.outputs.prerelease }}
        run: |
          set -euo pipefail
          EXTRA_FLAGS=""
          if [[ "$PRE" == "true" ]]; then
            EXTRA_FLAGS="--prerelease"
          fi
          # --generate-notes 让 GitHub 自动归类 PR / commits 拼接到 body 末尾
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "$BODY" \
            --generate-notes \
            $EXTRA_FLAGS
